<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="t d">
  <title id="t">Model version 3 with dropout</title>
  <desc id="d">Version 3: a batch of 32 images of 150 by 150 goes through the base model, pooling gives vectors of 32 by 2048, Dense(100) gives the inner layer of 32 by 100, a Dropout layer gives 32 by 100, and Dense(10) gives outputs of 32 by 10. With droprate 0.5, each training iteration zeros out a random 50% of the inner layer; the size stays the same.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .bg{fill:#fdfcf5}.ink{fill:#1d2433}.muted{fill:#6b7280}.accent{fill:#2f5bea}.card{fill:#ffffff}.hdr{fill:#eef2ff}
    .s-ink{stroke:#1d2433;fill:none}.s-accent{stroke:#2f5bea;fill:none}.s-grid{stroke:#1d2433;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0f1420}.ink{fill:#e6e8ef}.muted{fill:#9aa3b2}.accent{fill:#7c9bff}.card{fill:#161c2a}.hdr{fill:#26304d}
      .s-ink{stroke:#e6e8ef}.s-accent{stroke:#7c9bff}.s-grid{stroke:#e6e8ef}
    }
  </style>
  <style>.serif{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Georgia,"Times New Roman",serif;font-style:italic}.halo{stroke:#fdfcf5}@media (prefers-color-scheme:dark){.halo{stroke:#0f1420}}</style>
  <style>.lblue{fill:#dceeff}.hl{fill:#fde047}.cell{fill:#eef2ff}
  @media (prefers-color-scheme:dark){.lblue{fill:#1c3350}.hl{fill:#a68a00}.cell{fill:#26304d}}</style>
  <defs>
<symbol id="tee" viewBox="0 0 100 100">
      <path d="M31,14 L42,10 Q50,19 58,10 L69,14 L93,30 L83,46 L72,39 L72,89 L28,89 L28,39 L17,46 L7,30 Z" fill="#1f2430"/>
      <path d="M42,10 Q50,19 58,10" fill="none" stroke="#3a4152" stroke-width="2"/>
      <circle cx="61" cy="30" r="4.5" fill="#f4f4f4"/>
    </symbol>
    <symbol id="photo" viewBox="0 0 144 144">
      <rect width="144" height="144" fill="#d4a15c"/>
      <g fill="#c08a46">
        <rect x="20" y="24" width="2" height="120"/><rect x="46" y="24" width="2" height="120"/><rect x="72" y="24" width="2" height="120"/>
        <rect x="98" y="24" width="2" height="120"/><rect x="124" y="24" width="2" height="120"/>
      </g>
      <rect width="144" height="22" fill="#efe9dc"/>
      <rect y="20" width="144" height="4" fill="#e2d9c6"/>
      <use href="#tee" x="17" y="26" width="110" height="110"/>
    </symbol>
    <marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
  </defs>
  <rect class="bg" width="1100" height="440" rx="18"/>
  <text x="1040" y="62" font-size="40" font-weight="800" text-anchor="middle" fill="#43a047">V3</text>
  <text class="muted" x="1040" y="84" font-size="12" text-anchor="middle">+ dropout</text>
  <rect class="hl" x="33" y="125" width="26" height="20" rx="4"/><text class="mono ink" x="36" y="141" font-size="15" font-weight="700">32</text>
  <text class="accent" x="98" y="112" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="1.5">INPUTS</text>
  <rect class="card" x="58" y="152" width="100" height="100" rx="5"/><rect class="s-ink" x="58" y="152" width="100" height="100" rx="5" stroke-width="1.6"/>
  <rect class="card" x="48" y="162" width="100" height="100" rx="5"/><rect class="s-ink" x="48" y="162" width="100" height="100" rx="5" stroke-width="1.6"/>
  <rect class="card" x="36" y="172" width="102" height="102" rx="5"/><use href="#photo" x="40" y="176" width="94" height="94"/><rect class="s-ink" x="36" y="172" width="102" height="102" rx="5" stroke-width="2"/>
  <text class="mono muted" x="88" y="296" font-size="12" text-anchor="middle">150×150×3</text>
  <g class="s-ink" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M168,213 H198 M168,227 H198 M188,204 L204,220 L188,236"/></g>
  <path class="s-ink" d="M184,364 V300" stroke-width="2" marker-end="url(#mi)"/>
  <text class="mono ink" x="184" y="384" font-size="14" font-weight="700" text-anchor="middle">base_model</text>
  <text class="accent" x="280" y="128" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="1.5">BASE</text>
  <text class="mono ink" x="280" y="150" font-size="13" text-anchor="middle"></text>
  <path class="lblue" d="M220,182 L240,162 H340 V244 L320,264 Z"/><rect class="lblue" x="220" y="182" width="100" height="82"/>
  <path class="s-ink" d="M220,182 L240,162 H340 V244 L320,264 M320,182 L340,162 M220,182 H320 V264 H220 Z" stroke-width="2.2" stroke-linejoin="round"/>
  <g class="s-ink" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M352,213 H382 M352,227 H382 M372,204 L388,220 L372,236"/></g>
  <path class="s-ink" d="M368,314 V250" stroke-width="2" marker-end="url(#mi)"/>
  <text class="mono ink" x="368" y="334" font-size="14" font-weight="700" text-anchor="middle">pooling</text>
  <text class="accent" x="454" y="128" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="1.5">VECTORS</text>
  <text class="mono ink" x="454" y="150" font-size="13" text-anchor="middle">32×2048</text>
  <rect class="card" x="404" y="160" width="100" height="120" rx="8"/><rect class="s-ink" x="404" y="160" width="100" height="120" rx="8" stroke-width="2.4"/>
  <g class="s-ink" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M514,213 H544 M514,227 H544 M534,204 L550,220 L534,236"/></g>
  <path class="s-ink" d="M530,364 V300" stroke-width="2" marker-end="url(#mi)"/>
  <text class="mono ink" x="530" y="384" font-size="14" font-weight="700" text-anchor="middle">Dense(100)</text>
  <text class="accent" x="601" y="128" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="1.5">INNER</text>
  <text class="mono ink" x="601" y="150" font-size="13" text-anchor="middle">32×100</text>
  <rect class="card" x="566" y="160" width="70" height="120" rx="8"/>
  <rect class="cell" x="576" y="165" width="50" height="9" rx="2"/>
  <rect class="cell" x="576" y="176" width="50" height="9" rx="2"/>
  <rect class="cell" x="576" y="187" width="50" height="9" rx="2"/>
  <rect class="cell" x="576" y="198" width="50" height="9" rx="2"/>
  <rect class="cell" x="576" y="209" width="50" height="9" rx="2"/>
  <rect class="cell" x="576" y="220" width="50" height="9" rx="2"/>
  <rect class="cell" x="576" y="231" width="50" height="9" rx="2"/>
  <rect class="cell" x="576" y="242" width="50" height="9" rx="2"/>
  <rect class="cell" x="576" y="253" width="50" height="9" rx="2"/>
  <rect class="cell" x="576" y="264" width="50" height="9" rx="2"/>
  <rect class="s-ink" x="566" y="160" width="70" height="120" rx="8" stroke-width="2.4"/>
  <g class="s-ink" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M648,213 H678 M648,227 H678 M668,204 L684,220 L668,236"/></g>
  <path class="s-ink" d="M664,314 V250" stroke-width="2" marker-end="url(#mi)"/>
  <text class="mono ink" x="664" y="334" font-size="14" font-weight="700" text-anchor="middle">Dropout(?)</text>
  <text class="accent" x="731" y="128" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="1.5">DROP</text>
  <text class="mono ink" x="731" y="150" font-size="13" text-anchor="middle">32×100</text>
  <rect class="card" x="696" y="160" width="70" height="120" rx="8"/>
  <rect class="cell" x="706" y="165" width="50" height="9" rx="2"/>
  <rect class="cell" x="706" y="176" width="50" height="9" rx="2"/>
  <rect class="cell" x="706" y="187" width="50" height="9" rx="2"/>
  <rect class="cell" x="706" y="198" width="50" height="9" rx="2"/>
  <rect class="cell" x="706" y="209" width="50" height="9" rx="2"/>
  <rect class="cell" x="706" y="220" width="50" height="9" rx="2"/>
  <rect class="cell" x="706" y="231" width="50" height="9" rx="2"/>
  <rect class="cell" x="706" y="242" width="50" height="9" rx="2"/>
  <rect class="cell" x="706" y="253" width="50" height="9" rx="2"/>
  <rect class="cell" x="706" y="264" width="50" height="9" rx="2"/>
  <rect x="706" y="165" width="50" height="9" rx="2" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;1;1" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
  <rect x="706" y="176" width="50" height="9" rx="2" fill="#111" opacity="0"><animate attributeName="opacity" values="0;0;0;1" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
  <rect x="706" y="187" width="50" height="9" rx="2" fill="#111" opacity="0"><animate attributeName="opacity" values="1;0;1;0" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
  <rect x="706" y="198" width="50" height="9" rx="2" fill="#111" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
  <rect x="706" y="209" width="50" height="9" rx="2" fill="#111" opacity="0"><animate attributeName="opacity" values="0;1;0;0" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
  <rect x="706" y="220" width="50" height="9" rx="2" fill="#111" opacity="0"><animate attributeName="opacity" values="1;0;0;1" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
  <rect x="706" y="231" width="50" height="9" rx="2" fill="#111" opacity="0"><animate attributeName="opacity" values="1;1;1;1" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
  <rect x="706" y="242" width="50" height="9" rx="2" fill="#111" opacity="0"><animate attributeName="opacity" values="0;1;0;0" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
  <rect x="706" y="253" width="50" height="9" rx="2" fill="#111" opacity="0"><animate attributeName="opacity" values="1;0;1;0" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
  <rect x="706" y="264" width="50" height="9" rx="2" fill="#111" opacity="0"><animate attributeName="opacity" values="1;1;0;1" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect>
  <rect class="s-ink" x="696" y="160" width="70" height="120" rx="8" stroke-width="2.4"/>
  <g class="s-ink" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M778,213 H808 M778,227 H808 M798,204 L814,220 L798,236"/></g>
  <path class="s-ink" d="M794,364 V300" stroke-width="2" marker-end="url(#mi)"/>
  <text class="mono ink" x="794" y="384" font-size="14" font-weight="700" text-anchor="middle">Dense(10)</text>
  <text class="accent" x="846" y="128" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="1.5">OUTPUTS</text>
  <text class="mono ink" x="846" y="150" font-size="13" text-anchor="middle">32×10</text>
  <rect class="card" x="826" y="175" width="40" height="90" rx="8"/><rect class="s-ink" x="826" y="175" width="40" height="90" rx="8" stroke-width="2.4"/>
  <g opacity="0"><animate attributeName="opacity" values="1;0;0;0" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/><text class="mono muted" x="731" y="300" font-size="11" text-anchor="middle">iteration 1</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;1;0;0" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/><text class="mono muted" x="731" y="300" font-size="11" text-anchor="middle">iteration 2</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;0" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/><text class="mono muted" x="731" y="300" font-size="11" text-anchor="middle">iteration 3</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;0;1" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/><text class="mono muted" x="731" y="300" font-size="11" text-anchor="middle">iteration 4</text></g>
  <g transform="translate(880,300)">
    <text class="ink" x="0" y="0" font-size="14" font-weight="800">droprate = 0.5</text>
    <text class="muted" x="0" y="20" font-size="12">50% of the layer is zeroed</text>
    <text class="muted" x="0" y="36" font-size="12">each iteration (training only);</text>
    <text class="muted" x="0" y="52" font-size="12">the size stays 32×100</text>
    <rect x="0" y="66" width="14" height="9" rx="2" fill="#111"/><text class="muted" x="22" y="75" font-size="12">= dropped</text>
  </g>
</svg>
