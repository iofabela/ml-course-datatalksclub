<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="t6 d6">
  <title id="t6">CNN overview</title>
  <desc id="d6">An image of a t-shirt goes into a convolutional neural network made of many layers, layer 1, layer 2 up to layer N, and comes out as the prediction T-SHIRT. A CNN has two kinds of layers: convolutional layers and dense layers.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .bg{fill:#fdfcf5}.ink{fill:#1d2433}.muted{fill:#6b7280}.accent{fill:#2f5bea}.card{fill:#ffffff}
    .s-ink{stroke:#1d2433;fill:none}.s-accent{stroke:#2f5bea;fill:none}
    .conv{fill:#eef2ff}.dense{fill:#fff1e6}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0f1420}.ink{fill:#e6e8ef}.muted{fill:#9aa3b2}.accent{fill:#7c9bff}.card{fill:#161c2a}
      .s-ink{stroke:#e6e8ef}.s-accent{stroke:#7c9bff}
      .conv{fill:#1b2340}.dense{fill:#33241a}
    }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
    <symbol id="tee" viewBox="0 0 100 100">
      <path d="M31,14 L42,10 Q50,19 58,10 L69,14 L93,30 L83,46 L72,39 L72,89 L28,89 L28,39 L17,46 L7,30 Z" fill="#1f2430"/>
      <path d="M42,10 Q50,19 58,10" fill="none" stroke="#3a4152" stroke-width="2"/>
      <circle cx="61" cy="30" r="4.5" fill="#f4f4f4"/>
    </symbol>
    <symbol id="photo" viewBox="0 0 144 144">
      <rect width="144" height="144" fill="#d4a15c"/>
      <g fill="#c08a46">
        <rect x="20" y="24" width="2" height="120"/><rect x="46" y="24" width="2" height="120"/><rect x="72" y="24" width="2" height="120"/>
        <rect x="98" y="24" width="2" height="120"/><rect x="124" y="24" width="2" height="120"/>
      </g>
      <rect width="144" height="22" fill="#efe9dc"/>
      <rect y="20" width="144" height="4" fill="#e2d9c6"/>
      <use href="#tee" x="17" y="26" width="110" height="110"/>
    </symbol>
    <path id="flow" d="M160,210 H790"/>
  </defs>

  <rect class="bg" width="900" height="450" rx="18"/>

  <!-- input image -->
  <rect class="card" x="26" y="146" width="128" height="128" rx="6"/>
  <use href="#photo" x="30" y="150" width="120" height="120"/>
  <rect class="s-ink" x="26" y="146" width="128" height="128" rx="6" stroke-width="2"/>

  <!-- ⇒ in -->
  <g class="s-ink" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M166,203 H196 M166,217 H196 M188,194 L202,210 L188,226"/>
  </g>

  <!-- CNN box -->
  <text class="ink" x="475" y="46" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="3">CNN</text>
  <rect class="card" x="215" y="60" width="520" height="300" rx="14"/>
  <rect class="s-ink" x="215" y="60" width="520" height="300" rx="14" stroke-width="2.5"/>

  <!-- layers -->
  <g font-size="15" font-weight="800" text-anchor="middle" letter-spacing="2">
    <rect class="conv" x="250" y="100" width="64" height="220" rx="8"/>
    <rect class="s-accent" x="250" y="100" width="64" height="220" rx="8" stroke-width="2.5"/>
    <text class="accent" transform="translate(287,210) rotate(-90)">LAYER 1</text>

    <rect class="conv" x="365" y="100" width="64" height="220" rx="8"/>
    <rect class="s-accent" x="365" y="100" width="64" height="220" rx="8" stroke-width="2.5"/>
    <text class="accent" transform="translate(402,210) rotate(-90)">LAYER 2</text>

    <rect class="dense" x="635" y="100" width="64" height="220" rx="8"/>
    <rect x="635" y="100" width="64" height="220" rx="8" fill="none" stroke="#e8743b" stroke-width="2.5"/>
    <text fill="#e8743b" transform="translate(672,210) rotate(-90)">LAYER N</text>
  </g>

  <!-- sweeping highlight -->
  <g fill="#fde047">
    <rect x="250" y="100" width="64" height="220" rx="8" opacity="0">
      <animate attributeName="opacity" values="0;0;.45;0;0" keyTimes="0;0.12;0.2;0.3;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="365" y="100" width="64" height="220" rx="8" opacity="0">
      <animate attributeName="opacity" values="0;0;.45;0;0" keyTimes="0;0.28;0.36;0.46;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="635" y="100" width="64" height="220" rx="8" opacity="0">
      <animate attributeName="opacity" values="0;0;.45;0;0" keyTimes="0;0.6;0.68;0.78;1" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- arrows between layers -->
  <g class="s-ink" stroke-width="2.5" stroke-linecap="round">
    <path d="M320,210 H357" marker-end="url(#ah-ink)"/>
    <path d="M435,210 H470" marker-end="url(#ah-ink)"/>
    <path d="M590,210 H627" marker-end="url(#ah-ink)"/>
  </g>
  <g class="ink">
    <circle cx="498" cy="210" r="3.5"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="210" r="3.5"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".2s" repeatCount="indefinite"/></circle>
    <circle cx="542" cy="210" r="3.5"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".4s" repeatCount="indefinite"/></circle>
    <circle cx="564" cy="210" r="3.5"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- signal travelling through the network -->
  <circle r="7" fill="#fde047" stroke="#1d2433" stroke-width="2" opacity="0">
    <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8;1" keyPoints="0;1;1"><mpath href="#flow"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.78;0.82;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- ⇒ out -->
  <g class="s-ink" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M748,203 H778 M748,217 H778 M770,194 L784,210 L770,226"/>
  </g>
  <g>
    <animate attributeName="opacity" values=".25;.25;1;1;.25" keyTimes="0;0.8;0.86;0.97;1" dur="4s" repeatCount="indefinite"/>
    <rect x="796" y="193" width="92" height="34" rx="17" fill="#2f5bea"/>
    <text x="842" y="216" font-size="15" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="1">T-SHIRT</text>
  </g>

  <!-- legend -->
  <g font-size="17" font-weight="700">
    <circle cx="240" cy="392" r="13" fill="none" stroke="#2f5bea" stroke-width="2.5"/>
    <text x="240" y="398" font-size="14" font-weight="800" text-anchor="middle" fill="#2f5bea">1</text>
    <rect x="262" y="383" width="18" height="18" rx="4" class="conv" stroke="#2f5bea" stroke-width="2"/>
    <text class="accent" x="290" y="398">Convolutional layers</text>

    <circle cx="240" cy="426" r="13" fill="none" stroke="#e8743b" stroke-width="2.5"/>
    <text x="240" y="432" font-size="14" font-weight="800" text-anchor="middle" fill="#e8743b">2</text>
    <rect x="262" y="417" width="18" height="18" rx="4" class="dense" stroke="#e8743b" stroke-width="2"/>
    <text x="290" y="432" fill="#e8743b">Dense layers</text>
  </g>
</svg>
