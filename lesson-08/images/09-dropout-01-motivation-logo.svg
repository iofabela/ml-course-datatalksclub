<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
  <title id="t">Dropout: freezing random inner neurons during training</title>
  <desc id="d">The t-shirt image has details, like the logo, collar and sleeve ends, and an overall shape. The CNN turns it into a vector representation, and a dense layer connects it to the inner layer and then to the output. During training, dropout picks a random inner neuron at each step and freezes it: it is not updated, while the other neurons are updated. A different neuron is dropped each time, so the network cannot rely on one detail and has to focus on the overall shape.</desc>
