<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d">
  <title id="t">Callbacks after each epoch</title>
  <desc id="d">Training runs for 10 epochs. At the end of each epoch the model is evaluated on the validation dataset, and then the callbacks are invoked, for example History and ModelCheckpoint.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .bg{fill:#fdfcf5}.ink{fill:#1d2433}.muted{fill:#6b7280}.accent{fill:#2f5bea}.card{fill:#ffffff}.hdr{fill:#eef2ff}
    .s-ink{stroke:#1d2433;fill:none}.s-accent{stroke:#2f5bea;fill:none}.s-grid{stroke:#1d2433;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0f1420}.ink{fill:#e6e8ef}.muted{fill:#9aa3b2}.accent{fill:#7c9bff}.card{fill:#161c2a}.hdr{fill:#26304d}
      .s-ink{stroke:#e6e8ef}.s-accent{stroke:#7c9bff}.s-grid{stroke:#e6e8ef}
    }
  </style>
  <style>.serif{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Georgia,"Times New Roman",serif;font-style:italic}.halo{stroke:#fdfcf5}@media (prefers-color-scheme:dark){.halo{stroke:#0f1420}}</style>
  <style>.grnf{fill:#e6f4e6}@media (prefers-color-scheme:dark){.grnf{fill:#1d3320}}</style>
  <defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker></defs>
  <rect class="bg" width="1000" height="330" rx="18"/>
  <text class="ink" x="36" y="276" font-size="17" font-weight="800" letter-spacing="2">EPOCHS</text>
  <path id="a0" class="s-ink" d="M158,188 Q230.0,100 302,188" stroke-width="2.5" fill="none" marker-end="url(#mi)"/>
  <path id="a1" class="s-ink" d="M338,188 Q410.0,100 482,188" stroke-width="2.5" fill="none" marker-end="url(#mi)"/>
  <path id="a2" class="s-ink" d="M518,188 Q570.0,100 622,188" stroke-width="2.5" fill="none" marker-end="url(#mi)"/>
  <path id="a3" class="s-ink" d="M718,188 Q770.0,100 822,188" stroke-width="2.5" fill="none" marker-end="url(#mi)"/>
  <g class="ink"><circle cx="650" cy="210" r="4"/><circle cx="670" cy="210" r="4"/><circle cx="690" cy="210" r="4"/></g>
  <circle class="card" cx="140" cy="210" r="26"/><circle class="s-ink" cx="140" cy="210" r="26" stroke-width="2.5"/>
  <circle cx="140" cy="210" r="26" fill="none" stroke="#2f5bea" stroke-width="5" stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 140 210)">
    <animate attributeName="stroke-dashoffset" values="163.4;163.4;0;0;163.4" keyTimes="0;0.000;0.120;0.98;1" dur="9.0s" repeatCount="indefinite"/>
  </circle>
  <text class="ink" x="140" y="276" font-size="20" font-weight="800" text-anchor="middle">1</text>
  <circle class="card" cx="320" cy="210" r="26"/><circle class="s-ink" cx="320" cy="210" r="26" stroke-width="2.5"/>
  <circle cx="320" cy="210" r="26" fill="none" stroke="#2f5bea" stroke-width="5" stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 320 210)">
    <animate attributeName="stroke-dashoffset" values="163.4;163.4;0;0;163.4" keyTimes="0;0.220;0.340;0.98;1" dur="9.0s" repeatCount="indefinite"/>
  </circle>
  <text class="ink" x="320" y="276" font-size="20" font-weight="800" text-anchor="middle">2</text>
  <circle class="card" cx="500" cy="210" r="26"/><circle class="s-ink" cx="500" cy="210" r="26" stroke-width="2.5"/>
  <circle cx="500" cy="210" r="26" fill="none" stroke="#2f5bea" stroke-width="5" stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 500 210)">
    <animate attributeName="stroke-dashoffset" values="163.4;163.4;0;0;163.4" keyTimes="0;0.440;0.560;0.98;1" dur="9.0s" repeatCount="indefinite"/>
  </circle>
  <text class="ink" x="500" y="276" font-size="20" font-weight="800" text-anchor="middle">3</text>
  <circle class="card" cx="840" cy="210" r="26"/><circle class="s-ink" cx="840" cy="210" r="26" stroke-width="2.5"/>
  <circle cx="840" cy="210" r="26" fill="none" stroke="#2f5bea" stroke-width="5" stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 840 210)">
    <animate attributeName="stroke-dashoffset" values="163.4;163.4;0;0;163.4" keyTimes="0;0.700;0.820;0.98;1" dur="9.0s" repeatCount="indefinite"/>
  </circle>
  <text class="ink" x="840" y="276" font-size="20" font-weight="800" text-anchor="middle">10</text>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.120;0.130;0.210;0.220;1" dur="9.0s" repeatCount="indefinite"/>
    <rect class="hdr" x="144.0" y="14" width="172" height="28" rx="14"/>
    <text class="accent" x="230.0" y="33" font-size="13" font-weight="800" text-anchor="middle">① eval on validation</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.160;0.170;0.210;0.220;1" dur="9.0s" repeatCount="indefinite"/>
      <rect class="grnf" x="144.0" y="48" width="172" height="44" rx="10" stroke="#43a047" stroke-width="1.8"/>
      <text x="230.0" y="66" font-size="13" font-weight="800" text-anchor="middle" fill="#43a047">② → callbacks</text>
      <text class="mono muted" x="230.0" y="83" font-size="10.5" text-anchor="middle">History · ModelCheckpoint</text>
    </g>
  </g>
  <circle r="7" fill="#fde047" stroke="#1d2433" stroke-width="2" opacity="0">
    <animateMotion dur="9.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.130;0.210;1" keyPoints="0;0;1;1"><mpath href="#a0"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.130;0.140;0.205;0.215;1" dur="9.0s" repeatCount="indefinite"/>
  </circle>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.340;0.350;0.430;0.440;1" dur="9.0s" repeatCount="indefinite"/>
    <rect class="hdr" x="324.0" y="14" width="172" height="28" rx="14"/>
    <text class="accent" x="410.0" y="33" font-size="13" font-weight="800" text-anchor="middle">① eval on validation</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.380;0.390;0.430;0.440;1" dur="9.0s" repeatCount="indefinite"/>
      <rect class="grnf" x="324.0" y="48" width="172" height="44" rx="10" stroke="#43a047" stroke-width="1.8"/>
      <text x="410.0" y="66" font-size="13" font-weight="800" text-anchor="middle" fill="#43a047">② → callbacks</text>
      <text class="mono muted" x="410.0" y="83" font-size="10.5" text-anchor="middle">History · ModelCheckpoint</text>
    </g>
  </g>
  <circle r="7" fill="#fde047" stroke="#1d2433" stroke-width="2" opacity="0">
    <animateMotion dur="9.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.350;0.430;1" keyPoints="0;0;1;1"><mpath href="#a1"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.350;0.360;0.425;0.435;1" dur="9.0s" repeatCount="indefinite"/>
  </circle>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.560;0.570;0.650;0.660;1" dur="9.0s" repeatCount="indefinite"/>
    <rect class="hdr" x="484.0" y="14" width="172" height="28" rx="14"/>
    <text class="accent" x="570.0" y="33" font-size="13" font-weight="800" text-anchor="middle">① eval on validation</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.600;0.610;0.650;0.660;1" dur="9.0s" repeatCount="indefinite"/>
      <rect class="grnf" x="484.0" y="48" width="172" height="44" rx="10" stroke="#43a047" stroke-width="1.8"/>
      <text x="570.0" y="66" font-size="13" font-weight="800" text-anchor="middle" fill="#43a047">② → callbacks</text>
      <text class="mono muted" x="570.0" y="83" font-size="10.5" text-anchor="middle">History · ModelCheckpoint</text>
    </g>
  </g>
  <circle r="7" fill="#fde047" stroke="#1d2433" stroke-width="2" opacity="0">
    <animateMotion dur="9.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.570;0.650;1" keyPoints="0;0;1;1"><mpath href="#a2"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.570;0.580;0.645;0.655;1" dur="9.0s" repeatCount="indefinite"/>
  </circle>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.820;0.830;0.970;0.980;1" dur="9.0s" repeatCount="indefinite"/>
    <rect class="hdr" x="754" y="14" width="172" height="28" rx="14"/>
    <text class="accent" x="840" y="33" font-size="13" font-weight="800" text-anchor="middle">① eval on validation</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.860;0.870;0.970;0.980;1" dur="9.0s" repeatCount="indefinite"/>
      <rect class="grnf" x="754" y="48" width="172" height="44" rx="10" stroke="#43a047" stroke-width="1.8"/>
      <text x="840" y="66" font-size="13" font-weight="800" text-anchor="middle" fill="#43a047">② → callbacks</text>
      <text class="mono muted" x="840" y="83" font-size="10.5" text-anchor="middle">History · ModelCheckpoint</text>
    </g>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.900;0.910;0.970;0.980;1" dur="9.0s" repeatCount="indefinite"/>
    <text x="930" y="216" font-size="16" font-weight="800" text-anchor="middle" fill="#43a047">done ✓</text>
  </g>
</svg>
