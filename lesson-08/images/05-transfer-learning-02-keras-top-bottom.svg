<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="t d">
  <title id="t">Base model and new top in Keras</title>
  <desc id="d">In Keras the network goes from bottom to top: the input image, then the convolutional layers, which produce the vector representation, and at the top the dense layers that make the prediction. The dense part is called the top. include_top=False means the dense layers are not included, so we create a new top. trainable=False freezes the convolutional layers, the bottom, so they do not change during training.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .bg{fill:#fdfcf5}.ink{fill:#1d2433}.muted{fill:#6b7280}.accent{fill:#2f5bea}.card{fill:#ffffff}.hdr{fill:#eef2ff}
    .s-ink{stroke:#1d2433;fill:none}.s-accent{stroke:#2f5bea;fill:none}.s-grid{stroke:#1d2433;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0f1420}.ink{fill:#e6e8ef}.muted{fill:#9aa3b2}.accent{fill:#7c9bff}.card{fill:#161c2a}.hdr{fill:#26304d}
      .s-ink{stroke:#e6e8ef}.s-accent{stroke:#7c9bff}.s-grid{stroke:#e6e8ef}
    }
  </style>
  <style>.serif{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Georgia,"Times New Roman",serif;font-style:italic}.halo{stroke:#fdfcf5}@media (prefers-color-scheme:dark){.halo{stroke:#0f1420}}</style>
  <style>.frz{fill:#a9adf0}@media (prefers-color-scheme:dark){.frz{fill:#3a3f8f}}</style>
  <defs>
<symbol id="tee" viewBox="0 0 100 100">
      <path d="M31,14 L42,10 Q50,19 58,10 L69,14 L93,30 L83,46 L72,39 L72,89 L28,89 L28,39 L17,46 L7,30 Z" fill="#1f2430"/>
      <path d="M42,10 Q50,19 58,10" fill="none" stroke="#3a4152" stroke-width="2"/>
      <circle cx="61" cy="30" r="4.5" fill="#f4f4f4"/>
    </symbol>
    <symbol id="photo" viewBox="0 0 144 144">
      <rect width="144" height="144" fill="#d4a15c"/>
      <g fill="#c08a46">
        <rect x="20" y="24" width="2" height="120"/><rect x="46" y="24" width="2" height="120"/><rect x="72" y="24" width="2" height="120"/>
        <rect x="98" y="24" width="2" height="120"/><rect x="124" y="24" width="2" height="120"/>
      </g>
      <rect width="144" height="22" fill="#efe9dc"/>
      <rect y="20" width="144" height="4" fill="#e2d9c6"/>
      <use href="#tee" x="17" y="26" width="110" height="110"/>
    </symbol>
    <marker id="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker>
    <path id="sig" d="M510,600 V140"/>
  </defs>
  <rect class="bg" width="1000" height="720" rx="18"/>

  <!-- input -->
  <rect class="card" x="456" y="596" width="108" height="108" rx="6"/>
  <use href="#photo" x="460" y="600" width="100" height="100"/>
  <rect class="s-ink" x="456" y="596" width="108" height="108" rx="6" stroke-width="2"/>
  <text class="accent" x="372" y="664" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle">INPUT</text>
  <path class="s-accent" d="M412,658 Q430,650 446,652" stroke-width="2.2" marker-end="url(#mk)"/>
  <g class="s-ink" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M504,590 V560 M516,590 V560 M494,572 L510,556 L526,572"/></g>

  <!-- conv (frozen) -->
  <rect class="frz" x="330" y="424" width="360" height="126" rx="12"/>
  <g opacity=".5" stroke="#ffffff" stroke-width="2">
    <path d="M352,450 l8,0 M356,446 l0,8 M640,520 l8,0 M644,516 l0,8 M660,444 l8,0 M664,440 l0,8 M350,528 l8,0 M354,524 l0,8"/>
  </g>
  <rect class="s-ink" x="330" y="424" width="360" height="126" rx="12" stroke-width="2.5"/>
  <text class="ink" x="510" y="480" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="2">CONVOLUTIONAL</text>
  <text class="ink" x="510" y="508" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="2">LAYERS</text>
  <g transform="translate(650,486)" class="s-ink" stroke-width="2.2" stroke-linecap="round">
    <path d="M-9,-2 V-7 a9,9 0 0 1 18,0 V-2"/><rect x="-12" y="-2" width="24" height="16" rx="3"/>
  </g>
  <text class="accent" x="640" y="604" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle">FROZEN</text>
  <path class="s-accent" d="M644,584 Q650,570 652,556" stroke-width="2.2" marker-end="url(#mk)"/>
  <g class="s-ink" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M504,418 V396 M516,418 V396 M494,408 L510,392 L526,408"/></g>

  <!-- vector -->
  <rect class="card" x="320" y="336" width="380" height="50" rx="8"/>
  <rect class="s-ink" x="320" y="336" width="380" height="50" rx="8" stroke-width="2.5"/>
  <text class="ink" x="510" y="368" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="3">VECTOR REPRESENTATION</text>
  <g class="s-ink" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M504,330 V300 M516,330 V300 M494,312 L510,296 L526,312"/></g>

  <!-- top -->
  <ellipse cx="510" cy="186" rx="240" ry="126" fill="none" class="s-accent" stroke-width="3"/>
  <text class="ink" x="510" y="100" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="3">PREDICTION</text>
  <g class="s-ink" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M504,170 V118 M516,170 V118 M494,130 L510,114 L526,130"/></g>

  <g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.28;0.36;0.99;1" dur="7.0s" repeatCount="indefinite"/>
    <rect class="card" x="400" y="178" width="220" height="80" rx="10"/>
    <rect class="s-ink" x="400" y="178" width="220" height="80" rx="10" stroke-width="2.5"/>
    <text class="ink" x="510" y="211" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="2">DENSE</text>
    <text class="ink" x="510" y="237" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="2">LAYERS</text>
    <text x="510" y="276" font-size="12" font-weight="700" text-anchor="middle" fill="#e5484d">ImageNet · 1000 classes</text>
  </g>
  <path d="M290,300 L730,72" stroke="#e5484d" stroke-width="12" stroke-linecap="round" fill="none" stroke-dasharray="500" stroke-dashoffset="500">
    <animate attributeName="stroke-dashoffset" values="500;500;0;0;500" keyTimes="0;0.1;0.22;0.99;1" dur="7.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.36;0.99;1" dur="7.0s" repeatCount="indefinite"/>
  </path>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.44;0.96;1" dur="7.0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,-30;0,-30;0,0;0,0" keyTimes="0;0.38;0.46;1" dur="7.0s" repeatCount="indefinite"/>
    <rect class="card" x="400" y="178" width="220" height="80" rx="10"/>
    <rect x="400" y="178" width="220" height="80" rx="10" fill="none" stroke="#43a047" stroke-width="3"/>
    <text x="510" y="211" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="2" fill="#43a047">NEW TOP</text>
    <text class="mono ink" x="510" y="238" font-size="15" text-anchor="middle">Dense(10)</text>
    <text x="510" y="276" font-size="12" font-weight="700" text-anchor="middle" fill="#43a047">our 10 classes · trainable</text>
  </g>
  <circle r="7" fill="#fde047" stroke="#1d2433" stroke-width="2" opacity="0">
    <animateMotion dur="7.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5;0.86;1" keyPoints="0;0;1;1"><mpath href="#sig"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.84;0.87;1" dur="7.0s" repeatCount="indefinite"/>
  </circle>

  <!-- left notes -->
  <text class="mono" x="34" y="206" font-size="19" font-weight="700"><tspan class="accent">include_top=</tspan><tspan fill="#e5484d">False</tspan></text>
  <text class="ink" x="34" y="236" font-size="16" font-weight="700">= don't include the</text>
  <text class="ink" x="50" y="258" font-size="16" font-weight="700">dense layers</text>
  <text class="mono" x="34" y="470" font-size="19" font-weight="700"><tspan class="accent">trainable=</tspan><tspan fill="#e5484d">False</tspan></text>
  <text class="ink" x="34" y="500" font-size="16" font-weight="700">= freeze the conv layers</text>

  <!-- right notes -->
  <text class="accent" x="800" y="170" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="2">“TOP”</text>
  <text class="accent" x="830" y="282" font-size="16" font-weight="800" text-anchor="middle">create new top</text>
  <path class="s-accent" d="M790,276 Q770,262 746,250" stroke-width="2.2" marker-end="url(#mk)"/>
  <path class="s-accent" d="M730,424 q14,0 14,14 v104 q0,14 14,14 q-14,0 -14,14 v104 q0,14 -14,14" stroke-width="3" stroke-linecap="round"/>
  <text class="accent" x="850" y="566" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="2">“BOTTOM”</text>
</svg>
