<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="t d">
  <title id="t">Data augmentation</title>
  <desc id="d">From one 150 by 150 t-shirt image we generate 10 more different images. Possible image transformations include flips, horizontal and vertical, and rotation. When the image is rotated, its corners stick out of the 150 by 150 frame and are cut out, and the empty corners are filled in.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .bg{fill:#fdfcf5}.ink{fill:#1d2433}.muted{fill:#6b7280}.accent{fill:#2f5bea}.card{fill:#ffffff}.hdr{fill:#eef2ff}
    .s-ink{stroke:#1d2433;fill:none}.s-accent{stroke:#2f5bea;fill:none}.s-grid{stroke:#1d2433;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0f1420}.ink{fill:#e6e8ef}.muted{fill:#9aa3b2}.accent{fill:#7c9bff}.card{fill:#161c2a}.hdr{fill:#26304d}
      .s-ink{stroke:#e6e8ef}.s-accent{stroke:#7c9bff}.s-grid{stroke:#e6e8ef}
    }
  </style>
  <style>.serif{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Georgia,"Times New Roman",serif;font-style:italic}.halo{stroke:#fdfcf5}@media (prefers-color-scheme:dark){.halo{stroke:#0f1420}}</style>
  
  <defs>
<symbol id="tee" viewBox="0 0 100 100">
      <path d="M31,14 L42,10 Q50,19 58,10 L69,14 L93,30 L83,46 L72,39 L72,89 L28,89 L28,39 L17,46 L7,30 Z" fill="#1f2430"/>
      <path d="M42,10 Q50,19 58,10" fill="none" stroke="#3a4152" stroke-width="2"/>
      <circle cx="61" cy="30" r="4.5" fill="#f4f4f4"/>
    </symbol>
    <symbol id="photo" viewBox="0 0 144 144">
      <rect width="144" height="144" fill="#d4a15c"/>
      <g fill="#c08a46">
        <rect x="20" y="24" width="2" height="120"/><rect x="46" y="24" width="2" height="120"/><rect x="72" y="24" width="2" height="120"/>
        <rect x="98" y="24" width="2" height="120"/><rect x="124" y="24" width="2" height="120"/>
      </g>
      <rect width="144" height="22" fill="#efe9dc"/>
      <rect y="20" width="144" height="4" fill="#e2d9c6"/>
      <use href="#tee" x="17" y="26" width="110" height="110"/>
    </symbol>
    <marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker>
    <clipPath id="c50"><rect width="52" height="52" rx="3"/></clipPath>
    <clipPath id="c130"><rect width="130" height="130"/></clipPath>
  </defs>
  <rect class="bg" width="1000" height="660" rx="18"/>

  <rect class="card" x="56" y="40" width="158" height="158" rx="6"/>
  <use href="#photo" x="60" y="44" width="150" height="150"/>
  <rect class="s-ink" x="56" y="40" width="158" height="158" rx="6" stroke-width="2"/>
  <text class="mono ink" x="135" y="222" font-size="14" font-weight="700" text-anchor="middle">150</text>
  <text class="mono ink" x="44" y="124" font-size="14" font-weight="700" text-anchor="end">150</text>
  <g class="s-accent" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M236,84 H266 M236,98 H266 M256,74 L274,91 L256,108"/></g>
  <text class="accent" x="296" y="82" font-size="26" font-weight="800" letter-spacing="1">Generate 10 more different images</text>
  <g transform="translate(296,110)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.08;0.97;1" dur="8.0s" repeatCount="indefinite"/>
    <rect class="card" x="-2" y="-2" width="56" height="56" rx="4"/>
    <g clip-path="url(#c50)"><rect width="52" height="52" fill="#d4a15c"/><use href="#photo" width="52" height="52" transform="translate(31.3,23.3) rotate(8.1) scale(-1.16,1.16) translate(-26,-26)"/></g>
    <rect class="s-ink" x="-2" y="-2" width="56" height="56" rx="4" stroke-width="1.6"/>
  </g>
  <g transform="translate(358,110)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.13;0.97;1" dur="8.0s" repeatCount="indefinite"/>
    <rect class="card" x="-2" y="-2" width="56" height="56" rx="4"/>
    <g clip-path="url(#c50)"><rect width="52" height="52" fill="#d4a15c"/><use href="#photo" width="52" height="52" transform="translate(23.6,28.2) rotate(9.4) scale(-1.16,1.16) translate(-26,-26)"/></g>
    <rect class="s-ink" x="-2" y="-2" width="56" height="56" rx="4" stroke-width="1.6"/>
  </g>
  <g transform="translate(420,110)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.18;0.97;1" dur="8.0s" repeatCount="indefinite"/>
    <rect class="card" x="-2" y="-2" width="56" height="56" rx="4"/>
    <g clip-path="url(#c50)"><rect width="52" height="52" fill="#d4a15c"/><use href="#photo" width="52" height="52" transform="translate(22.7,30.8) rotate(11.1) scale(-1.03,1.03) translate(-26,-26)"/></g>
    <rect class="s-ink" x="-2" y="-2" width="56" height="56" rx="4" stroke-width="1.6"/>
  </g>
  <g transform="translate(482,110)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.20;0.23;0.97;1" dur="8.0s" repeatCount="indefinite"/>
    <rect class="card" x="-2" y="-2" width="56" height="56" rx="4"/>
    <g clip-path="url(#c50)"><rect width="52" height="52" fill="#d4a15c"/><use href="#photo" width="52" height="52" transform="translate(27.6,21.8) rotate(-9.6) scale(-1.20,1.20) translate(-26,-26)"/></g>
    <rect class="s-ink" x="-2" y="-2" width="56" height="56" rx="4" stroke-width="1.6"/>
  </g>
  <g transform="translate(544,110)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.28;0.97;1" dur="8.0s" repeatCount="indefinite"/>
    <rect class="card" x="-2" y="-2" width="56" height="56" rx="4"/>
    <g clip-path="url(#c50)"><rect width="52" height="52" fill="#d4a15c"/><use href="#photo" width="52" height="52" transform="translate(27.8,21.5) rotate(6.6) scale(1.04,1.04) translate(-26,-26)"/></g>
    <rect class="s-ink" x="-2" y="-2" width="56" height="56" rx="4" stroke-width="1.6"/>
  </g>
  <g transform="translate(606,110)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.30;0.33;0.97;1" dur="8.0s" repeatCount="indefinite"/>
    <rect class="card" x="-2" y="-2" width="56" height="56" rx="4"/>
    <g clip-path="url(#c50)"><rect width="52" height="52" fill="#d4a15c"/><use href="#photo" width="52" height="52" transform="translate(31.7,24.8) rotate(-16.7) scale(-1.05,1.05) translate(-26,-26)"/></g>
    <rect class="s-ink" x="-2" y="-2" width="56" height="56" rx="4" stroke-width="1.6"/>
  </g>
  <g transform="translate(668,110)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.38;0.97;1" dur="8.0s" repeatCount="indefinite"/>
    <rect class="card" x="-2" y="-2" width="56" height="56" rx="4"/>
    <g clip-path="url(#c50)"><rect width="52" height="52" fill="#d4a15c"/><use href="#photo" width="52" height="52" transform="translate(30.5,28.2) rotate(-2.5) scale(1.15,1.15) translate(-26,-26)"/></g>
    <rect class="s-ink" x="-2" y="-2" width="56" height="56" rx="4" stroke-width="1.6"/>
  </g>
  <g transform="translate(730,110)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.40;0.43;0.97;1" dur="8.0s" repeatCount="indefinite"/>
    <rect class="card" x="-2" y="-2" width="56" height="56" rx="4"/>
    <g clip-path="url(#c50)"><rect width="52" height="52" fill="#d4a15c"/><use href="#photo" width="52" height="52" transform="translate(22.2,21.1) rotate(3.6) scale(-1.16,1.16) translate(-26,-26)"/></g>
    <rect class="s-ink" x="-2" y="-2" width="56" height="56" rx="4" stroke-width="1.6"/>
  </g>
  <g transform="translate(792,110)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.48;0.97;1" dur="8.0s" repeatCount="indefinite"/>
    <rect class="card" x="-2" y="-2" width="56" height="56" rx="4"/>
    <g clip-path="url(#c50)"><rect width="52" height="52" fill="#d4a15c"/><use href="#photo" width="52" height="52" transform="translate(25.4,22.6) rotate(0.6) scale(1.05,1.05) translate(-26,-26)"/></g>
    <rect class="s-ink" x="-2" y="-2" width="56" height="56" rx="4" stroke-width="1.6"/>
  </g>
  <g transform="translate(854,110)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.50;0.53;0.97;1" dur="8.0s" repeatCount="indefinite"/>
    <rect class="card" x="-2" y="-2" width="56" height="56" rx="4"/>
    <g clip-path="url(#c50)"><rect width="52" height="52" fill="#d4a15c"/><use href="#photo" width="52" height="52" transform="translate(29.8,21.1) rotate(0.0) scale(1.03,1.03) translate(-26,-26)"/></g>
    <rect class="s-ink" x="-2" y="-2" width="56" height="56" rx="4" stroke-width="1.6"/>
  </g>
  <path class="s-grid" d="M40,250 H960" stroke-width="1.5" stroke-dasharray="4 6" opacity=".6"/>
  <text class="accent" x="60" y="296" font-size="24" font-weight="800" letter-spacing="1">Possible image transformations</text>

  <circle class="accent" cx="72" cy="365" r="5"/>
  <text class="accent" x="90" y="374" font-size="26" font-weight="800" letter-spacing="1">FLIP</text>
  <g transform="translate(300,322)">
    <rect class="card" width="80" height="80" rx="6"/><rect class="s-ink" width="80" height="80" rx="6" stroke-width="2.4"/>
    <text class="ink" x="40" y="58" font-size="46" font-weight="800" text-anchor="middle" transform="">R</text>
    <text class="muted" x="40" y="102" font-size="12" font-weight="700" text-anchor="middle">original</text>
  </g>
  <path class="s-accent" d="M392,362 H426" stroke-width="2.4" marker-start="url(#mi)" marker-end="url(#mi)"/>
  <g transform="translate(440,322)">
    <rect class="card" width="80" height="80" rx="6"/><rect class="s-ink" width="80" height="80" rx="6" stroke-width="2.4"/>
    <text class="ink" x="40" y="58" font-size="46" font-weight="800" text-anchor="middle" transform="translate(80,0) scale(-1,1)">R</text>
    <text class="muted" x="40" y="102" font-size="12" font-weight="700" text-anchor="middle">horizontal flip</text>
  </g>
  <path class="s-accent" d="M532,362 H566" stroke-width="2.4" marker-end="url(#mi)"/>
  <g transform="translate(580,322)">
    <rect class="card" width="80" height="80" rx="6"/><rect class="s-ink" width="80" height="80" rx="6" stroke-width="2.4"/>
    <text class="ink" x="40" y="58" font-size="46" font-weight="800" text-anchor="middle" transform="translate(0,80) scale(1,-1)">R</text>
    <text class="muted" x="40" y="102" font-size="12" font-weight="700" text-anchor="middle">vertical flip</text>
  </g>
  <circle class="accent" cx="72" cy="556" r="5"/>
  <text class="accent" x="90" y="565" font-size="26" font-weight="800" letter-spacing="1">ROTATION</text>

  <g transform="translate(320,492)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 65 65;-25 65 65;25 65 65;0 65 65" dur="8.0s" repeatCount="indefinite"/>
      <use href="#photo" width="130" height="130"/>
      <rect width="130" height="130" fill="#e5484d" opacity=".45"/>
    </g>
    <g clip-path="url(#c130)"><rect width="130" height="130" class="bg"/><g><animateTransform attributeName="transform" type="rotate" values="0 65 65;-25 65 65;25 65 65;0 65 65" dur="8.0s" repeatCount="indefinite"/><use href="#photo" width="130" height="130"/></g></g>
    <rect width="130" height="130" fill="none" class="s-ink" stroke-width="3"/>
  </g>
  <mask id="outside" maskUnits="userSpaceOnUse" x="-100" y="-100" width="400" height="400">
    <rect x="-100" y="-100" width="400" height="400" fill="#fff"/>
  </mask>
  <text x="385" y="478" font-size="16" font-weight="800" text-anchor="middle" fill="#e5484d">corners cut out</text>
  <path class="s-accent" d="M478,557 H534" stroke-width="2.4" marker-end="url(#mi)"/>
  <g transform="translate(560,492)">
    <rect width="130" height="130" class="card"/>
    <g clip-path="url(#c130)">
      <rect width="130" height="130" fill="#d4a15c" opacity=".55"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0 65 65;-25 65 65;25 65 65;0 65 65" dur="8.0s" repeatCount="indefinite"/>
        <use href="#photo" width="130" height="130"/></g>
    </g>
    <rect width="130" height="130" fill="none" class="s-ink" stroke-width="3"/>
  </g>
  <text class="mono ink" x="625" y="642" font-size="13" font-weight="700" text-anchor="middle">150</text>
  <text class="mono ink" x="700" y="562" font-size="13" font-weight="700">150</text>
  <text class="muted" x="625" y="478" font-size="13" font-weight="700" text-anchor="middle">result: still 150×150</text>
</svg>
