<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t4 d4">
  <title id="t4">Keras inside TensorFlow and input image sizes</title>
  <desc id="d4">Keras sits on top of TensorFlow. Pre-trained models expect images of a fixed size, for example 299 by 299 pixels or 224 by 224 pixels.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .bg{fill:#fdfcf5}.ink{fill:#1d2433}.muted{fill:#6b7280}.accent{fill:#2f5bea}.onacc{fill:#ffffff}
    .s-ink{stroke:#1d2433;fill:none}.s-accent{stroke:#2f5bea;fill:none}.s-grid{stroke:#d6d3c4;fill:none}
    .card{fill:#ffffff}.pill{fill:#ffffff}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0f1420}.ink{fill:#e6e8ef}.muted{fill:#9aa3b2}.accent{fill:#7c9bff}.onacc{fill:#0f1420}
      .s-ink{stroke:#e6e8ef}.s-accent{stroke:#7c9bff}.s-grid{stroke:#2c3448}
      .card{fill:#161c2a}.pill{fill:#0f1420}
    }
  </style>
  <defs>
    <marker id="ah-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker>
    <symbol id="tee" viewBox="0 0 100 100">
      <path d="M31,14 L42,10 Q50,19 58,10 L69,14 L93,30 L83,46 L72,39 L72,89 L28,89 L28,39 L17,46 L7,30 Z" fill="#1f2430"/>
      <path d="M42,10 Q50,19 58,10" fill="none" stroke="#3a4152" stroke-width="2"/>
      <circle cx="61" cy="30" r="4.5" fill="#f4f4f4"/>
    </symbol>
    <symbol id="photo" viewBox="0 0 144 144">
      <rect width="144" height="144" fill="#d4a15c"/>
      <g fill="#c08a46">
        <rect x="20" y="24" width="2" height="120"/><rect x="46" y="24" width="2" height="120"/><rect x="72" y="24" width="2" height="120"/>
        <rect x="98" y="24" width="2" height="120"/><rect x="124" y="24" width="2" height="120"/>
      </g>
      <rect width="144" height="22" fill="#efe9dc"/>
      <rect y="20" width="144" height="4" fill="#e2d9c6"/>
      <use href="#tee" x="17" y="26" width="110" height="110"/>
    </symbol>
    <pattern id="px" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12,0 H0 V12" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect class="bg" width="800" height="520" rx="18"/>

  <!-- ===== Keras inside TensorFlow ===== -->
  <rect class="card" x="250" y="30" width="300" height="180" rx="14"/>
  <rect class="s-ink" x="250" y="30" width="300" height="180" rx="14" stroke-width="2.5"/>
  <g class="accent">
    <circle cx="330" cy="105" r="4.5" opacity="0">
      <animate attributeName="cy" values="105;185" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="105" r="4.5" opacity="0">
      <animate attributeName="cy" values="105;185" dur="1.8s" begin=".6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.8s" begin=".6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="105" r="4.5" opacity="0">
      <animate attributeName="cy" values="105;185" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text class="accent" x="400" y="160" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="2">TENSORFLOW</text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,-24;0,0" dur=".8s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/>
    <animate attributeName="opacity" values="0;1" dur=".6s" begin=".3s" fill="freeze"/>
    <rect class="accent" x="275" y="50" width="250" height="48" rx="10"/>
    <text class="onacc" x="400" y="82" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="2">KERAS</text>
  </g>

  <!-- ===== Input sizes ===== -->
  <text class="muted" x="400" y="258" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">INPUT IMAGE SIZE</text>

  <!-- 299 x 299 -->
  <g>
    <use href="#photo" x="180" y="275" width="180" height="180"/>
    <rect x="180" y="275" width="180" height="180" fill="url(#px)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.35;0.8;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect class="s-ink" x="180" y="275" width="180" height="180" rx="4" stroke-width="2.5" stroke-dasharray="720" stroke-dashoffset="720">
      <animate attributeName="stroke-dashoffset" values="720;0" dur="1.2s" begin=".6s" fill="freeze"/>
    </rect>
    <rect class="pill" x="215" y="413" width="110" height="34" rx="17" opacity=".92"/>
    <text class="mono ink" x="270" y="436" font-size="16" font-weight="700" text-anchor="middle">299 × 299</text>
    <text class="muted" x="270" y="480" font-size="12" text-anchor="middle">e.g. Xception</text>
  </g>

  <!-- resize arrow -->
  <path class="s-accent" d="M372,400 H422" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#ah-acc)">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <text class="accent" x="397" y="390" font-size="11" font-weight="700" text-anchor="middle">resize</text>

  <!-- 224 x 224 -->
  <g>
    <use href="#photo" x="435" y="320" width="135" height="135"/>
    <rect x="435" y="320" width="135" height="135" fill="url(#px)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.55;0.9;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect class="s-ink" x="435" y="320" width="135" height="135" rx="4" stroke-width="2.5" stroke-dasharray="540" stroke-dashoffset="540">
      <animate attributeName="stroke-dashoffset" values="540;0" dur="1.2s" begin="1.2s" fill="freeze"/>
    </rect>
    <rect class="pill" x="450" y="415" width="105" height="32" rx="16" opacity=".92"/>
    <text class="mono ink" x="502.5" y="437" font-size="15" font-weight="700" text-anchor="middle">224 × 224</text>
    <text class="muted" x="502.5" y="480" font-size="12" text-anchor="middle">e.g. MobileNet, ResNet50</text>
  </g>
</svg>
