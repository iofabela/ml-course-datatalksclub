<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 545" width="800" height="545" role="img" aria-labelledby="t1 d1">
  <title id="t1">8.1 Fashion Classification</title>
  <desc id="d1">Until now our data came from CSV files as tables with columns like model, make, mpg and MSRP. Now the input is an image: a photo of a t-shirt.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .bg{fill:#fdfcf5}.ink{fill:#1d2433}.muted{fill:#6b7280}.accent{fill:#2f5bea}
    .s-ink{stroke:#1d2433;fill:none}.s-accent{stroke:#2f5bea;fill:none}.s-grid{stroke:#d6d3c4;fill:none}
    .hdr{fill:#eef2ff}.card{fill:#ffffff}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0f1420}.ink{fill:#e6e8ef}.muted{fill:#9aa3b2}.accent{fill:#7c9bff}
      .s-ink{stroke:#e6e8ef}.s-accent{stroke:#7c9bff}.s-grid{stroke:#2c3448}
      .hdr{fill:#1b2340}.card{fill:#161c2a}
    }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
    <marker id="ah-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker>
    <symbol id="tee" viewBox="0 0 100 100">
      <path d="M31,14 L42,10 Q50,19 58,10 L69,14 L93,30 L83,46 L72,39 L72,89 L28,89 L28,39 L17,46 L7,30 Z" fill="#1f2430"/>
      <path d="M42,10 Q50,19 58,10" fill="none" stroke="#3a4152" stroke-width="2"/>
      <circle cx="61" cy="30" r="4.5" fill="#f4f4f4"/>
    </symbol>
    <symbol id="photo" viewBox="0 0 184 144">
      <rect width="184" height="144" fill="#d4a15c"/>
      <g fill="#c08a46">
        <rect x="22" y="24" width="2" height="120"/><rect x="48" y="24" width="2" height="120"/><rect x="74" y="24" width="2" height="120"/>
        <rect x="100" y="24" width="2" height="120"/><rect x="126" y="24" width="2" height="120"/><rect x="152" y="24" width="2" height="120"/>
      </g>
      <rect width="184" height="22" fill="#efe9dc"/>
      <rect y="20" width="184" height="4" fill="#e2d9c6"/>
      <use href="#tee" x="37" y="26" width="110" height="110"/>
    </symbol>
    <clipPath id="clip-photo"><rect x="248" y="372" width="184" height="144" rx="3"/></clipPath>
  </defs>

  <rect class="bg" width="800" height="545" rx="18"/>

  <!-- Title -->
  <text x="40" y="58" font-size="30" font-weight="700"><tspan class="accent">8.1</tspan><tspan class="ink" dx="8">Fashion Classification</tspan></text>
  <path class="s-accent" d="M40,72 H420" stroke-width="3" stroke-dasharray="380" stroke-dashoffset="380">
    <animate attributeName="stroke-dashoffset" values="380;0;0" keyTimes="0;0.15;1" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- ===== Tabular data ===== -->
  <text class="muted" x="40" y="108" font-size="12" font-weight="700" letter-spacing="2">BEFORE · TABULAR DATA</text>

  <!-- CSV file icon -->
  <g transform="translate(64,150)">
    <path class="card" d="M0,0 H52 L74,22 V96 H0 Z"/>
    <path class="s-ink" d="M0,0 H52 L74,22 V96 H0 Z M52,0 V22 H74" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="10" y="40" width="54" height="22" rx="4" class="accent"/>
    <text x="37" y="56" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">CSV</text>
    <rect x="12" y="72" width="50" height="3" rx="1.5" class="muted" opacity=".5"/>
    <rect x="12" y="80" width="36" height="3" rx="1.5" class="muted" opacity=".5"/>
    <text class="muted" x="37" y="118" font-size="13" text-anchor="middle">file</text>
  </g>

  <!-- arrow csv -> table -->
  <path class="s-ink" d="M152,198 H222" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#ah-ink)">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- Table -->
  <rect class="card" x="240" y="125" width="400" height="156" rx="8"/>
  <rect class="hdr" x="240" y="125" width="400" height="36" rx="8"/>
  <rect class="hdr" x="240" y="145" width="400" height="16"/>
  <g class="ink" font-size="14" font-weight="700">
    <text x="252" y="148">model</text><text x="342" y="148">make</text><text x="422" y="148">mpg</text>
    <text x="482" y="148">…</text><text x="542" y="148">MSRP</text>
  </g>
  <g class="mono ink" font-size="13">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.2;0.92;1" dur="7s" repeatCount="indefinite"/>
      <text x="252" y="187">Civic</text><text x="342" y="187">Honda</text><text x="422" y="187">36</text><text x="482" y="187">…</text><text x="542" y="187">$24,950</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.3;0.92;1" dur="7s" repeatCount="indefinite"/>
      <text x="252" y="227">Corolla</text><text x="342" y="227">Toyota</text><text x="422" y="227">35</text><text x="482" y="227">…</text><text x="542" y="227">$22,050</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.4;0.92;1" dur="7s" repeatCount="indefinite"/>
      <text x="252" y="267">Mustang</text><text x="342" y="267">Ford</text><text x="422" y="267">25</text><text x="482" y="267">…</text><text x="542" y="267">$31,920</text>
    </g>
  </g>
  <g class="s-grid" stroke-width="1.5">
    <path d="M330,125 V281 M410,125 V281 M470,125 V281 M530,125 V281 M240,201 H640 M240,241 H640"/>
  </g>
  <path class="s-ink" d="M240,161 H640" stroke-width="2"/>
  <rect class="s-ink" x="240" y="125" width="400" height="156" rx="8" stroke-width="2.5"/>

  <!-- brace + TABLE -->
  <path class="s-accent" d="M660,125 q14,0 14,14 v50 q0,14 14,14 q-14,0 -14,14 v50 q0,14 -14,14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="accent" x="702" y="209" font-size="26" font-weight="800" letter-spacing="1">TABLE</text>
  <text class="muted" x="702" y="230" font-size="12">rows × columns</text>

  <!-- divider -->
  <path class="s-grid" d="M40,318 H760" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- ===== Image data ===== -->
  <text class="muted" x="40" y="352" font-size="12" font-weight="700" letter-spacing="2">NOW · IMAGE DATA</text>

  <rect class="card" x="240" y="364" width="200" height="160" rx="8"/>
  <rect class="s-ink" x="240" y="364" width="200" height="160" rx="8" stroke-width="2.5"/>
  <g clip-path="url(#clip-photo)">
    <use href="#photo" x="248" y="372" width="184" height="144"/>
    <!-- scanning line -->
    <rect x="248" y="372" width="184" height="26" fill="#7c9bff" opacity=".22">
      <animate attributeName="y" values="350;516" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="248" y="372" width="184" height="2.5" fill="#7c9bff">
      <animate attributeName="y" values="374;540" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- curved arrow -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;6,-6;0,0" dur="1.6s" repeatCount="indefinite"/>
    <path class="s-accent" d="M150,520 Q156,458 226,446" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-acc)"/>
  </g>
  <text class="muted" x="70" y="470" font-size="13" font-style="italic">our input</text>

  <!-- label -->
  <text class="accent" x="480" y="430" font-size="26" font-weight="800" letter-spacing="1">IMAGE</text>
  <text class="muted" x="480" y="452" font-size="12">no columns — just pixels</text>
  <text class="mono muted" x="480" y="474" font-size="12">e.g. 299 × 299 × 3</text>
</svg>
