    <path class="s-ink" d="M490,140 L690,180 M490,330 L690,300" stroke-width="2.4"/>
    <rect class="card" x="140" y="70" width="60" height="330" rx="8"/><rect class="s-ink" x="140" y="70" width="60" height="330" rx="8" stroke-width="2.5"/>
    <circle class="s-ink" cx="170" cy="102" r="13" stroke-width="2.4"/>
    <circle class="s-ink" cx="170" cy="144" r="13" stroke-width="2.4"/>
    <circle class="s-ink" cx="170" cy="372" r="13" stroke-width="2.4"/>
