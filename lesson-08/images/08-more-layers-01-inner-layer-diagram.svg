    <circle class="ink" cx="170" cy="240" r="3"/>
    <circle class="ink" cx="170" cy="280" r="3"/>
    <circle class="ink" cx="170" cy="320" r="3"/>
    <text class="muted" x="170" y="426" font-size="12" text-anchor="middle">vectors · 2048</text>
    <rect class="card" x="420" y="140" width="54" height="190" rx="8"/><rect class="s-ink" x="420" y="140" width="54" height="190" rx="8" stroke-width="2.5"/>
    <circle class="s-ink" cx="447" cy="164" r="10" stroke-width="2.2"/>
    <circle class="s-ink" cx="447" cy="194" r="10" stroke-width="2.2"/>
    <circle class="s-ink" cx="447" cy="224" r="10" stroke-width="2.2"/>
    <circle class="s-ink" cx="447" cy="254" r="10" stroke-width="2.2"/>
    <circle class="s-ink" cx="447" cy="304" r="10" stroke-width="2.2"/>
    <circle class="ink" cx="447" cy="276" r="2.5"/><circle class="ink" cx="447" cy="286" r="2.5"/>
    <rect x="476" y="140" width="14" height="190" rx="5" fill="#2f5bea">
      <animate attributeName="opacity" values="1;.45;1" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <text class="muted" x="447" y="352" font-size="12" text-anchor="middle">inner · 100</text>
