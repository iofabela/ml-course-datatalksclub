<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d">
  <title id="t">Transfer learning</title>
  <desc id="d">The convolutional layers and the vector representation were already trained on ImageNet. They are generic, so we keep them and do not need to change them. The dense layers are specific to ImageNet, with 1000 outputs for its 1000 classes, so we throw them away and train new dense layers with 10 outputs for our classes, which then predict T-SHIRT.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .bg{fill:#fdfcf5}.ink{fill:#1d2433}.muted{fill:#6b7280}.accent{fill:#2f5bea}.card{fill:#ffffff}.hdr{fill:#eef2ff}
    .s-ink{stroke:#1d2433;fill:none}.s-accent{stroke:#2f5bea;fill:none}.s-grid{stroke:#1d2433;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0f1420}.ink{fill:#e6e8ef}.muted{fill:#9aa3b2}.accent{fill:#7c9bff}.card{fill:#161c2a}.hdr{fill:#26304d}
      .s-ink{stroke:#e6e8ef}.s-accent{stroke:#7c9bff}.s-grid{stroke:#e6e8ef}
    }
  </style>
  <style>.serif{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Georgia,"Times New Roman",serif;font-style:italic}.halo{stroke:#fdfcf5}@media (prefers-color-scheme:dark){.halo{stroke:#0f1420}}</style>
  <style>.ylw{stroke:#fde047}@media (prefers-color-scheme:dark){.ylw{stroke:#d4b106}}</style>
  <defs>
<symbol id="tee" viewBox="0 0 100 100">
      <path d="M31,14 L42,10 Q50,19 58,10 L69,14 L93,30 L83,46 L72,39 L72,89 L28,89 L28,39 L17,46 L7,30 Z" fill="#1f2430"/>
      <path d="M42,10 Q50,19 58,10" fill="none" stroke="#3a4152" stroke-width="2"/>
      <circle cx="61" cy="30" r="4.5" fill="#f4f4f4"/>
    </symbol>
    <symbol id="photo" viewBox="0 0 144 144">
      <rect width="144" height="144" fill="#d4a15c"/>
      <g fill="#c08a46">
        <rect x="20" y="24" width="2" height="120"/><rect x="46" y="24" width="2" height="120"/><rect x="72" y="24" width="2" height="120"/>
        <rect x="98" y="24" width="2" height="120"/><rect x="124" y="24" width="2" height="120"/>
      </g>
      <rect width="144" height="22" fill="#efe9dc"/>
      <rect y="20" width="144" height="4" fill="#e2d9c6"/>
      <use href="#tee" x="17" y="26" width="110" height="110"/>
    </symbol>
    <image id="f0" href="data:image/png;base64," width="10" height="10" preserveAspectRatio="none" style="image-rendering:pixelated"/>
    <image id="f1" href="data:image/png;base64," width="10" height="10" preserveAspectRatio="none" style="image-rendering:pixelated"/>
    <image id="f2" href="data:image/png;base64," width="10" height="10" preserveAspectRatio="none" style="image-rendering:pixelated"/>
    <path id="sig" d="M150,190 H880"/>
  </defs>
  <rect class="bg" width="1000" height="540" rx="18"/>

  <!-- frames -->
  <rect class="ylw" x="200" y="96" width="394" height="376" rx="18" fill="none" stroke-width="9" opacity=".9"/>
  <rect class="ylw" x="614" y="96" width="254" height="376" rx="18" fill="none" stroke-width="9" opacity=".9"/>
  <text class="accent" x="397" y="52" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="2">ALREADY TRAINED</text>
  <text class="accent" x="397" y="78" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="2">ON IMAGENET</text>
  <text class="accent" x="335" y="454" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="3">KEEP</text>
  <text class="accent" x="740" y="454" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="3">TRAIN NEW</text>
  <text x="397" y="508" font-size="16" font-weight="800" text-anchor="middle" fill="#e5484d">Generic — no need to change it</text>
  <text x="740" y="508" font-size="16" font-weight="800" text-anchor="middle" fill="#e5484d">Specific to ImageNet</text>

  <g transform="translate(0,90)">
  <rect class="card" x="26" y="126" width="128" height="128" rx="6"/>
  <use href="#photo" x="30" y="130" width="120" height="120"/>
  <rect class="s-ink" x="26" y="126" width="128" height="128" rx="6" stroke-width="2"/>
  <g class="s-ink" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M162,182 H190 M162,198 H190 M180,172 L198,190 L180,208"/></g>
  <g class="s-ink" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M470,182 H498 M470,198 H498 M488,172 L506,190 L488,208"/></g>
  <g class="s-ink" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M580,182 H608 M580,198 H608 M598,172 L616,190 L598,208"/></g>
  <g class="s-ink" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M866,182 H894 M866,198 H894 M884,172 L902,190 L884,208"/></g>
  <rect class="card" x="220" y="60" width="230" height="260" rx="14"/>
  <rect class="s-ink" x="220" y="60" width="230" height="260" rx="14" stroke-width="2.5"/>
  <text class="ink" x="335" y="168" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="2">CONV</text>
  <text class="ink" x="335" y="198" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="2">LAYERS</text>
  <g transform="translate(290,232)">
    <rect width="26" height="26" rx="3" fill="#111"/><use href="#f0" transform="translate(2,2) scale(2.2)"/>
    <rect x="32" width="26" height="26" rx="3" fill="#111"/><use href="#f1" transform="translate(34,2) scale(2.2)"/>
    <rect x="64" width="26" height="26" rx="3" fill="#111"/><use href="#f2" transform="translate(66,2) scale(2.2)"/>
  </g>
  <rect class="card" x="516" y="28" width="56" height="324" rx="8"/>
  <rect class="s-ink" x="516" y="28" width="56" height="324" rx="8" stroke-width="2.5"/>
  <text class="ink" transform="translate(550,190) rotate(-90)" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="2.5">VECTOR REPRESENTATION</text>
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.38;0.44;0.99;1" dur="7.0s" repeatCount="indefinite"/>
    <rect class="card" x="634" y="60" width="214" height="260" rx="14"/>
    <rect class="s-ink" x="634" y="60" width="214" height="260" rx="14" stroke-width="2.5"/>
    <text class="ink" x="712" y="162" font-size="21" font-weight="800" text-anchor="middle" letter-spacing="1.5">DENSE</text>
    <text class="ink" x="712" y="190" font-size="21" font-weight="800" text-anchor="middle" letter-spacing="1.5">LAYERS</text>
    <rect x="794" y="84" width="34" height="212" rx="8" fill="none" stroke="#e5484d" stroke-width="2.5"/>
    <circle cx="811" cy="106" r="9" fill="none" stroke="#e5484d" stroke-width="2.2"/>
    <circle cx="811" cy="134" r="9" fill="none" stroke="#e5484d" stroke-width="2.2"/>
    <circle cx="811" cy="162" r="9" fill="none" stroke="#e5484d" stroke-width="2.2"/>
    <circle cx="811" cy="270" r="9" fill="none" stroke="#e5484d" stroke-width="2.2"/>
    <circle cx="811" cy="192" r="2.2" fill="#e5484d"/>
    <circle cx="811" cy="212" r="2.2" fill="#e5484d"/>
    <circle cx="811" cy="232" r="2.2" fill="#e5484d"/>
    <text x="811" y="312" font-size="13" font-weight="800" text-anchor="middle" fill="#e5484d">1000</text>
    <text x="712" y="250" font-size="12" font-weight="700" text-anchor="middle" fill="#e5484d">1000 ImageNet classes</text>

    <path d="M646,72 L836,308 M836,72 L646,308" stroke="#e5484d" stroke-width="11" stroke-linecap="round" fill="none" stroke-dasharray="302" stroke-dashoffset="302">
      <animate attributeName="stroke-dashoffset" values="302;302;0;0;302" keyTimes="0;0.22;0.32;0.99;1" dur="7.0s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- new dense -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.52;0.96;1" dur="7.0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,40;0,40;0,0;0,0" keyTimes="0;0.46;0.54;1" dur="7.0s" repeatCount="indefinite"/>
    <rect class="card" x="634" y="60" width="214" height="260" rx="14"/>
    <rect class="s-ink" x="634" y="60" width="214" height="260" rx="14" stroke-width="2.5"/>
    <text class="ink" x="712" y="148" font-size="21" font-weight="800" text-anchor="middle" letter-spacing="1.5">NEW</text>
    <text class="ink" x="712" y="176" font-size="21" font-weight="800" text-anchor="middle" letter-spacing="1.5">DENSE</text>
    <text class="ink" x="712" y="204" font-size="21" font-weight="800" text-anchor="middle" letter-spacing="1.5">LAYERS</text>
    <rect x="794" y="84" width="34" height="212" rx="8" fill="none" stroke="#43a047" stroke-width="2.5"/>
    <circle cx="811" cy="106" r="9" fill="none" stroke="#43a047" stroke-width="2.2"/>
    <circle cx="811" cy="134" r="9" fill="none" stroke="#43a047" stroke-width="2.2"/>
    <circle cx="811" cy="162" r="9" fill="none" stroke="#43a047" stroke-width="2.2"/>
    <circle cx="811" cy="270" r="9" fill="none" stroke="#43a047" stroke-width="2.2"/>
    <circle cx="811" cy="192" r="2.2" fill="#43a047"/>
    <circle cx="811" cy="212" r="2.2" fill="#43a047"/>
    <circle cx="811" cy="232" r="2.2" fill="#43a047"/>
    <text x="811" y="312" font-size="13" font-weight="800" text-anchor="middle" fill="#43a047">10</text>
    <text x="712" y="250" font-size="12" font-weight="700" text-anchor="middle" fill="#43a047">our 10 classes</text>

  </g>
  <text class="ink" x="955" y="160" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="2">PRED</text>
  <g opacity=".3"><animate attributeName="opacity" values=".3;.3;1;1;.3" keyTimes="0;0.84;0.87;0.96;1" dur="7.0s" repeatCount="indefinite"/>
    <rect x="910" y="174" width="84" height="32" rx="16" fill="#2f5bea"/>
    <text x="952" y="195" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="1">T-SHIRT</text>
  </g>
  <circle r="7" fill="#fde047" stroke="#1d2433" stroke-width="2" opacity="0">
    <animateMotion dur="7.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.56;0.86;1" keyPoints="0;0;1;1"><mpath href="#sig"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.57;0.84;0.87;1" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  </g>
</svg>
