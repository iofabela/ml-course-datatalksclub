<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 800 360" width="800" height="360" role="img" aria-labelledby="t3 d3">
  <title id="t3">Keras inside TensorFlow</title>
  <desc id="d3">Keras is a high-level API that sits on top of TensorFlow, the low-level engine that handles tensors, automatic differentiation and GPU or TPU execution.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .bg{fill:#fdfcf5}.ink{fill:#1d2433}.muted{fill:#6b7280}.accent{fill:#2f5bea}.onacc{fill:#ffffff}
    .s-ink{stroke:#1d2433;fill:none}.s-accent{stroke:#2f5bea;fill:none}.s-grid{stroke:#d6d3c4;fill:none}
    .hdr{fill:#eef2ff}.card{fill:#ffffff}.chip{fill:#f1efe6}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0f1420}.ink{fill:#e6e8ef}.muted{fill:#9aa3b2}.accent{fill:#7c9bff}.onacc{fill:#0f1420}
      .s-ink{stroke:#e6e8ef}.s-accent{stroke:#7c9bff}.s-grid{stroke:#2c3448}
      .hdr{fill:#1b2340}.card{fill:#161c2a}.chip{fill:#1c2333}
    }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
    <marker id="ah-mut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="muted"/></marker>
  </defs>

  <rect class="bg" y="80" width="800" height="360" rx="18"/>

  <!-- TensorFlow (outer) -->
  <rect class="card" x="210" y="110" width="380" height="290" rx="14"/>
  <rect class="s-ink" x="210" y="110" width="380" height="290" rx="14" stroke-width="2.5"/>

  <!-- data flowing from Keras down into TensorFlow -->
  <g class="accent">
    <circle cx="300" cy="200" r="5" opacity="0">
      <animate attributeName="cy" values="200;300" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="200" r="5" opacity="0">
      <animate attributeName="cy" values="200;300" dur="1.8s" begin=".6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.8s" begin=".6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="200" r="5" opacity="0">
      <animate attributeName="cy" values="200;300" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text class="accent" x="400" y="262" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="2">TENSORFLOW</text>

  <!-- engine parts -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect class="chip" x="236" y="305" width="100" height="34" rx="17"/>
    <text class="ink" x="286" y="327">tensors</text>
    <rect class="chip" x="350" y="305" width="100" height="34" rx="17"/>
    <text class="ink" x="400" y="327">gradients</text>
    <rect class="chip" x="464" y="305" width="100" height="34" rx="17"/>
    <text class="ink" x="514" y="327">GPU / TPU</text>
  </g>
  <g class="s-accent" stroke-width="2" fill="none">
    <rect x="236" y="305" width="100" height="34" rx="17" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="1.8s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="350" y="305" width="100" height="34" rx="17" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="1.8s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="464" y="305" width="100" height="34" rx="17" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="1.8s" begin="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text class="muted" x="400" y="372" font-size="12" text-anchor="middle">does the heavy math</text>

  <!-- Keras (inner, on top) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,-30;0,0" dur=".8s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/>
    <animate attributeName="opacity" values="0;1" dur=".6s" begin=".3s" fill="freeze"/>
    <rect class="accent" x="240" y="135" width="320" height="56" rx="10"/>
    <text class="onacc" x="400" y="172" font-size="26" font-weight="800" text-anchor="middle" letter-spacing="2">KERAS</text>
  </g>

  <!-- Your code -->
  <text class="muted" x="40" y="122" font-size="12" font-weight="700" letter-spacing="2">YOUR CODE</text>
  <rect class="card" x="40" y="132" width="150" height="62" rx="8"/>
  <rect class="s-ink" x="40" y="132" width="150" height="62" rx="8" stroke-width="2"/>
  <text class="mono ink" x="52" y="158" font-size="12">model.fit(</text>
  <text class="mono ink" x="52" y="178" font-size="12">  X, y)</text>
  <path class="s-ink" d="M190,163 H234" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#ah-ink)">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- annotations -->
  <path class="s-grid" d="M562,163 H640" stroke-width="2" stroke-dasharray="3 4"/>
  <text class="accent" x="648" y="160" font-size="15" font-weight="800">Keras</text>
  <text class="muted" x="648" y="178" font-size="12">high-level API:</text>
  <text class="muted" x="648" y="194" font-size="12">layers, models, fit()</text>

  <path class="s-grid" d="M592,262 H640" stroke-width="2" stroke-dasharray="3 4"/>
  <text class="ink" x="648" y="259" font-size="15" font-weight="800">TensorFlow</text>
  <text class="muted" x="648" y="277" font-size="12">low-level engine</text>
  <text class="muted" x="648" y="293" font-size="12">underneath Keras</text>
</svg>
