<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
  <title id="t">Dense layer with softmax: one output per class</title>
  <desc id="d">The elements x1 to xn of the vector x are each multiplied by a weight and summed, once per class, giving three sums for shirt, t-shirt and dress, each in its own color. Softmax turns the three sums into probabilities; here T-shirt gets 0.90.</desc>
