<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="1000" height="850" role="img" aria-labelledby="t d">
  <title id="t">More image transformations for data augmentation</title>
  <desc id="d">More possible image transformations: shift up, down, left or right; shear, where one corner moves so the image gets skewed, which is different from rotation; zoom in or out; brightness and contrast; and a black patch. These transformations can be combined.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .bg{fill:#fdfcf5}.ink{fill:#1d2433}.muted{fill:#6b7280}.accent{fill:#2f5bea}.card{fill:#ffffff}.hdr{fill:#eef2ff}
    .s-ink{stroke:#1d2433;fill:none}.s-accent{stroke:#2f5bea;fill:none}.s-grid{stroke:#1d2433;fill:none}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0f1420}.ink{fill:#e6e8ef}.muted{fill:#9aa3b2}.accent{fill:#7c9bff}.card{fill:#161c2a}.hdr{fill:#26304d}
      .s-ink{stroke:#e6e8ef}.s-accent{stroke:#7c9bff}.s-grid{stroke:#e6e8ef}
    }
  </style>
  <style>.serif{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Georgia,"Times New Roman",serif;font-style:italic}.halo{stroke:#fdfcf5}@media (prefers-color-scheme:dark){.halo{stroke:#0f1420}}</style>
  
  <defs>
<symbol id="tee" viewBox="0 0 100 100">
      <path d="M31,14 L42,10 Q50,19 58,10 L69,14 L93,30 L83,46 L72,39 L72,89 L28,89 L28,39 L17,46 L7,30 Z" fill="#1f2430"/>
      <path d="M42,10 Q50,19 58,10" fill="none" stroke="#3a4152" stroke-width="2"/>
      <circle cx="61" cy="30" r="4.5" fill="#f4f4f4"/>
    </symbol>
    <symbol id="photo" viewBox="0 0 144 144">
      <rect width="144" height="144" fill="#d4a15c"/>
      <g fill="#c08a46">
        <rect x="20" y="24" width="2" height="120"/><rect x="46" y="24" width="2" height="120"/><rect x="72" y="24" width="2" height="120"/>
        <rect x="98" y="24" width="2" height="120"/><rect x="124" y="24" width="2" height="120"/>
      </g>
      <rect width="144" height="22" fill="#efe9dc"/>
      <rect y="20" width="144" height="4" fill="#e2d9c6"/>
      <use href="#tee" x="17" y="26" width="110" height="110"/>
    </symbol>
    <marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
    <marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="accent"/></marker>
    <clipPath id="c"><rect width="100" height="100"/></clipPath>
    <filter id="dark"><feComponentTransfer><feFuncR type="linear" slope=".5"/><feFuncG type="linear" slope=".5"/><feFuncB type="linear" slope=".5"/></feComponentTransfer></filter>
    <filter id="bright"><feComponentTransfer><feFuncR type="linear" slope="1.1" intercept=".25"/><feFuncG type="linear" slope="1.1" intercept=".25"/><feFuncB type="linear" slope="1.1" intercept=".25"/></feComponentTransfer></filter>
    <filter id="locon"><feComponentTransfer><feFuncR type="linear" slope=".45" intercept=".3"/><feFuncG type="linear" slope=".45" intercept=".3"/><feFuncB type="linear" slope=".45" intercept=".3"/></feComponentTransfer></filter>
    <filter id="hicon"><feComponentTransfer><feFuncR type="linear" slope="1.8" intercept="-.4"/><feFuncG type="linear" slope="1.8" intercept="-.4"/><feFuncB type="linear" slope="1.8" intercept="-.4"/></feComponentTransfer></filter>
  </defs>
  <rect class="bg" width="1000" height="850" rx="18"/>
  <text class="accent" x="140" y="56" font-size="26" font-weight="800" letter-spacing="1">Possible image transformations <tspan class="muted" font-size="20">(cont'd)</tspan></text>

  <path class="s-accent" d="M118,90 q-14,0 -14,14 v339 q0,14 -14,14 q14,0 14,14 v339 q0,14 14,14" stroke-width="3" stroke-linecap="round"/>
  <text class="accent" transform="translate(56,457) rotate(-90)" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="2">WE CAN COMBINE THEM!</text>
  <circle class="accent" cx="146" cy="152" r="5"/><text class="accent" x="162" y="160" font-size="24" font-weight="800" letter-spacing="1">SHIFT</text>
  <g transform="translate(400,96)">
    <rect width="100" height="100" fill="#e5484d" opacity=".55"/>
    <g clip-path="url(#c)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,30;0,0;0,-30;0,0" dur="6.0s" repeatCount="indefinite"/><use href="#photo" width="100" height="100"/></g></g>
    <rect width="100" height="100" fill="none" class="s-ink" stroke-width="2.5"/>
    <text class="muted" x="50.0" y="118" font-size="12" font-weight="700" text-anchor="middle">up / down</text>
  </g>
  <g transform="translate(540,96)">
    <rect width="100" height="100" fill="#e5484d" opacity=".55"/>
    <g clip-path="url(#c)"><g><animateTransform attributeName="transform" type="translate" values="0,0;30,0;0,0;-30,0;0,0" dur="6.0s" repeatCount="indefinite"/><use href="#photo" width="100" height="100"/></g></g>
    <rect width="100" height="100" fill="none" class="s-ink" stroke-width="2.5"/>
    <text class="muted" x="50.0" y="118" font-size="12" font-weight="700" text-anchor="middle">left / right</text>
  </g>
  <path class="s-ink" d="M700,116 V182" stroke-width="2.4" marker-start="url(#mi)" marker-end="url(#mi)"/>
  <path class="s-ink" d="M730,149 H800" stroke-width="2.4" marker-start="url(#mi)" marker-end="url(#mi)"/>
  <rect x="830" y="140" width="14" height="14" fill="#e5484d" opacity=".55"/><text class="muted" x="852" y="152" font-size="12">empty area</text>
  <circle class="accent" cx="146" cy="302" r="5"/><text class="accent" x="162" y="310" font-size="24" font-weight="800" letter-spacing="1">SHEAR</text>
  <g transform="translate(400,250)">
    <g transform=""><rect class="card" width="90" height="90" rx="4"/><rect class="s-ink" width="90" height="90" rx="4" stroke-width="2.4"/><text class="ink" x="45" y="64" font-size="50" font-weight="800" text-anchor="middle">R</text></g>
    <text class="muted" x="45" y="118" font-size="12" font-weight="700" text-anchor="middle">original</text>
  </g>
  <circle cx="490" cy="340" r="5" fill="#e5484d"/><path d="M500,352 l22,22" stroke="#e5484d" stroke-width="2.4" marker-end="url(#mi)"/>
  <g transform="translate(540,250)">
    <g transform=""><animateTransform attributeName="transform" type="skewY" values="0;18;0;-18;0" dur="6.0s" repeatCount="indefinite"/><rect class="card" width="90" height="90" rx="4"/><rect class="s-ink" width="90" height="90" rx="4" stroke-width="2.4"/><text class="ink" x="45" y="64" font-size="50" font-weight="800" text-anchor="middle">R</text></g>
    <text class="muted" x="45" y="118" font-size="12" font-weight="700" text-anchor="middle">corner pulled</text>
  </g>
  <g transform="translate(670,250)">
    <g transform="matrix(1,0,-0.3,1,14,0)"><rect class="card" width="90" height="90" rx="4"/><rect class="s-ink" width="90" height="90" rx="4" stroke-width="2.4"/><text class="ink" x="45" y="64" font-size="50" font-weight="800" text-anchor="middle">R</text></g>
    <text class="muted" x="45" y="118" font-size="12" font-weight="700" text-anchor="middle">skewed</text>
  </g>
  <g transform="translate(840,250)">
    <g transform="rotate(-20 45 45)"><rect class="card" width="90" height="90" rx="4"/><rect class="s-ink" width="90" height="90" rx="4" stroke-width="2.4"/><text class="ink" x="45" y="64" font-size="50" font-weight="800" text-anchor="middle">R</text></g>
    <text class="muted" x="45" y="118" font-size="12" font-weight="700" text-anchor="middle">vs rotation</text>
  </g>
  <circle class="accent" cx="146" cy="462" r="5"/><text class="accent" x="162" y="470" font-size="24" font-weight="800" letter-spacing="1">ZOOM IN / OUT</text>
  <g transform="translate(470,410)">
    <rect width="100" height="100" fill="#e5484d" opacity=".55"/>
    <g clip-path="url(#c)"><g transform="translate(50,50)"><g><animateTransform attributeName="transform" type="scale" values="1;1.5;1;0.6;1" dur="6.0s" repeatCount="indefinite"/><use href="#photo" x="-50" y="-50" width="100" height="100"/></g></g></g>
    <rect width="100" height="100" fill="none" class="s-ink" stroke-width="2.5"/>
    <text class="muted" x="50.0" y="118" font-size="12" font-weight="700" text-anchor="middle">in ↔ out</text>
  </g>
  <g transform="translate(610,410)">
    <rect width="100" height="100" fill="#e5484d" opacity=".55"/>
    <g clip-path="url(#c)"><g transform="translate(50,50) scale(1.5)"><use href="#photo" x="-50" y="-50" width="100" height="100"/></g></g>
    <rect width="100" height="100" fill="none" class="s-ink" stroke-width="2.5"/>
    <text class="muted" x="50.0" y="118" font-size="12" font-weight="700" text-anchor="middle">zoom in (crop)</text>
  </g>
  <g transform="translate(750,410)">
    <rect width="100" height="100" fill="#e5484d" opacity=".55"/>
    <g clip-path="url(#c)"><g transform="translate(50,50) scale(0.6)"><use href="#photo" x="-50" y="-50" width="100" height="100"/></g></g>
    <rect width="100" height="100" fill="none" class="s-ink" stroke-width="2.5"/>
    <text class="muted" x="50.0" y="118" font-size="12" font-weight="700" text-anchor="middle">zoom out</text>
  </g>
  <circle class="accent" cx="146" cy="616" r="5"/><text class="accent" x="162" y="624" font-size="24" font-weight="800" letter-spacing="1">BRIGHTNESS / CONTRAST</text>
  <g transform="translate(520,568)">
    <rect width="100" height="100" fill="#000" opacity=".55"/>
    <g clip-path="url(#c)"><use href="#photo" width="100" height="100" filter="url(#dark)"/></g>
    <rect width="100" height="100" fill="none" class="s-ink" stroke-width="2.5"/>
    <text class="muted" x="50.0" y="118" font-size="12" font-weight="700" text-anchor="middle">darker</text>
  </g>
  <g transform="translate(638,568)">
    <rect width="100" height="100" fill="#000" opacity=".55"/>
    <g clip-path="url(#c)"><use href="#photo" width="100" height="100" filter="url(#bright)"/></g>
    <rect width="100" height="100" fill="none" class="s-ink" stroke-width="2.5"/>
    <text class="muted" x="50.0" y="118" font-size="12" font-weight="700" text-anchor="middle">brighter</text>
  </g>
  <g transform="translate(756,568)">
    <rect width="100" height="100" fill="#000" opacity=".55"/>
    <g clip-path="url(#c)"><use href="#photo" width="100" height="100" filter="url(#locon)"/></g>
    <rect width="100" height="100" fill="none" class="s-ink" stroke-width="2.5"/>
    <text class="muted" x="50.0" y="118" font-size="12" font-weight="700" text-anchor="middle">low contrast</text>
  </g>
  <g transform="translate(874,568)">
    <rect width="100" height="100" fill="#000" opacity=".55"/>
    <g clip-path="url(#c)"><use href="#photo" width="100" height="100" filter="url(#hicon)"/></g>
    <rect width="100" height="100" fill="none" class="s-ink" stroke-width="2.5"/>
    <text class="muted" x="50.0" y="118" font-size="12" font-weight="700" text-anchor="middle">high contrast</text>
  </g>
  <circle class="accent" cx="146" cy="762" r="5"/><text class="accent" x="162" y="770" font-size="24" font-weight="800" letter-spacing="1">BLACK PATCH</text>
  <g transform="translate(420,712)">
    <rect width="100" height="100" fill="#e5484d" opacity=".55"/>
    <g clip-path="url(#c)"><use href="#photo" width="100" height="100"/><rect width="38" height="38" rx="8" fill="#000"><animate attributeName="x" values="6;56;56;6;6" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="y" values="6;6;56;56;6" dur="6.0s" calcMode="discrete" repeatCount="indefinite"/></rect></g>
    <rect width="100" height="100" fill="none" class="s-ink" stroke-width="2.5"/>
    <text class="muted" x="50.0" y="118" font-size="12" font-weight="700" text-anchor="middle">random spot</text>
  </g>
  <text class="ink" x="600" y="770" font-size="28" font-weight="800">· · ·</text>
</svg>
