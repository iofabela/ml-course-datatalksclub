  <use href="#book" x="144.0" y="188.0" width="36.0" height="42.7" transform="rotate(0.7 162.0 209.3)"/>
  <use href="#book" x="184.0" y="188.0" width="36.0" height="42.7" transform="rotate(3.3 202.0 209.3)"/>
  <use href="#book" x="224.0" y="188.0" width="36.0" height="42.7" transform="rotate(-5.5 242.0 209.3)"/>
  <use href="#book" x="264.0" y="188.0" width="36.0" height="42.7" transform="rotate(1.0 282.0 209.3)"/>
  <use href="#book" x="304.0" y="188.0" width="36.0" height="42.7" transform="rotate(5.5 322.0 209.3)"/>
  <use href="#book" x="344.0" y="188.0" width="36.0" height="42.7" transform="rotate(-4.2 362.0 209.3)"/>
  <use href="#book" x="384.0" y="188.0" width="36.0" height="42.7" transform="rotate(5.5 402.0 209.3)"/>
