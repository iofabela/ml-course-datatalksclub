  <use href="#book" x="220.0" y="440.0" width="140.0" height="165.9" transform="rotate(-6.0 290.0 523.0)"/>
  <text x="640" y="200" font-size="26" font-weight="800" text-anchor="middle" fill="#e5484d" letter-spacing="1">FAST</text>
  <text class="accent" x="770" y="200" font-size="26" font-weight="800" text-anchor="middle" letter-spacing="1">HIGH</text>
  <text x="910" y="200" font-size="22" font-weight="800" text-anchor="middle" fill="#e5484d">poorly</text>
  <text class="ink" x="910" y="226" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="1.5">OVERFIT</text>
  <text x="640" y="348" font-size="26" font-weight="800" text-anchor="middle" fill="#43a047" letter-spacing="1">OK</text>
  <text class="accent" x="770" y="348" font-size="26" font-weight="800" text-anchor="middle" letter-spacing="1">MEDIUM</text>
  <text x="910" y="348" font-size="22" font-weight="800" text-anchor="middle" fill="#43a047">good ✓</text>
  <text class="ink" x="910" y="374" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="1.5">OK</text>
  <text x="640" y="528" font-size="26" font-weight="800" text-anchor="middle" fill="#e8743b" letter-spacing="1">SLOOOW</text>
  <text class="accent" x="770" y="528" font-size="26" font-weight="800" text-anchor="middle" letter-spacing="1">LOW</text>
  <text x="910" y="528" font-size="22" font-weight="800" text-anchor="middle" fill="#e5484d">poorly</text>
  <text class="ink" x="910" y="554" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="1.5">UNDERFIT</text>
</svg>
