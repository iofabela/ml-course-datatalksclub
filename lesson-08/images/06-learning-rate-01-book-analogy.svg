  <use href="#book" x="182.0" y="270.0" width="108.0" height="128.0" transform="rotate(4.2 236.0 334.0)"/>
  <use href="#book" x="300.0" y="270.0" width="108.0" height="128.0" transform="rotate(4.3 354.0 334.0)"/>
